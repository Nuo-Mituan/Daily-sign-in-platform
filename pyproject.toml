[project]
name = "daily-sign-in-platform"
version = "1.0.6"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["F", "E9"]
ignore = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "skip"
files = [
  "backend/app/contracts.py",
  "backend/app/services/lock_registry.py",
  "backend/app/services/push_outbox.py",
]
